# Render Unified Full-Stack Blueprint (Frontend + Backend in One Service)
# Deploys BOTH React UI and FastAPI into a single free public URL.
services:
  - type: web
    name: prohire-ai-unified
    runtime: python
    plan: free
    buildCommand: cd frontend-react && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
